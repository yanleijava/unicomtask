 Configuration snippets may be placed in this directory as well
includedir /etc/krb5.conf.d/

[logging]
 default = FILE:/var/log/krb5libs.log
 kdc = FILE:/var/log/krb5kdc.log
 admin_server = FILE:/var/log/kadmind.log

[libdefaults]
 dns_lookup_realm = false
 ticket_lifetime = 24h
# renew_lifetime = 7d
 forwardable = true
 rdns = false
 pkinit_anchors = FILE:/etc/pki/tls/certs/ca-bundle.crt
 default_realm = PULSAR.COM
 default_ccache_name = KEYRING:persistent:%{uid}

[realms]
 PULSAR.COM = {
  kdc = dezhi-2
  admin_server = dezhi-2
 }
 KAFKA.COM = {
  kdc = chinaunion-3
  admin_server = chinaunion-3
 }

[domain_realm]

dezhi-1.internal.cloudapp.net = KAFKA.COM
chinaunion-1.internal.cloudapp.net = PULSAR.COM
chinaunion-2.internal.cloudapp.net = PULSAR.COM
chinaunion-3.internal.cloudapp.net = PULSAR.COM
